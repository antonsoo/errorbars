<svg xmlns="http://www.w3.org/2000/svg" width="640" height="414" viewBox="0 0 640 414" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img">
<title>Leaderboard with paired comparisons</title>
<desc>Models ranked by mean with marginal confidence intervals. The right column lists exact other ranks without a significant paired difference; this does not establish equivalence. Untested comparisons are identified separately.</desc>
<rect width="640" height="414" fill="#ffffff"/>
<text x="12.0" y="34.0" text-anchor="start" font-size="11" font-family="monospace" fill="#374151">Rank / model</text>
<text x="332.5" y="34.0" text-anchor="middle" font-size="11" font-family="monospace" fill="#374151">Mean / CI</text>
<text x="460.0" y="34.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">Not separated: ranks</text>
<line x1="217.0" y1="48" x2="217.0" y2="268" stroke="#e5e7eb" stroke-width="1"/>
<text x="217.0" y="286.0" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">0.51</text>
<line x1="263.2" y1="48" x2="263.2" y2="268" stroke="#e5e7eb" stroke-width="1"/>
<text x="263.2" y="286.0" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">0.59</text>
<line x1="309.4" y1="48" x2="309.4" y2="268" stroke="#e5e7eb" stroke-width="1"/>
<text x="309.4" y="286.0" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">0.67</text>
<line x1="355.6" y1="48" x2="355.6" y2="268" stroke="#e5e7eb" stroke-width="1"/>
<text x="355.6" y="286.0" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">0.75</text>
<line x1="401.8" y1="48" x2="401.8" y2="268" stroke="#e5e7eb" stroke-width="1"/>
<text x="401.8" y="286.0" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">0.83</text>
<line x1="448.0" y1="48" x2="448.0" y2="268" stroke="#e5e7eb" stroke-width="1"/>
<text x="448.0" y="286.0" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">0.91</text>
<g class="model-row">
<title>leader</title>
<text x="12.0" y="74.0" text-anchor="start" font-size="11" font-family="monospace" fill="#374151">1. leader</text>
<text x="460.0" y="67.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">2, 5</text>
<text x="460.0" y="81.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">not tested: 3</text>
<line x1="337.7" y1="70.0" x2="428.8" y2="70.0" stroke="#2563eb" stroke-width="2"/>
<line x1="337.7" y1="65.0" x2="337.7" y2="75.0" stroke="#2563eb" stroke-width="2"/>
<line x1="428.8" y1="65.0" x2="428.8" y2="75.0" stroke="#2563eb" stroke-width="2"/>
<circle cx="383.2" cy="70.0" r="4.5" fill="#1d4ed8"/>
<text x="383.2" y="61.0" text-anchor="middle" font-size="10" font-family="monospace" fill="#374151">0.800</text>
</g>
<g class="model-row">
<title>wide-near</title>
<text x="12.0" y="118.0" text-anchor="start" font-size="11" font-family="monospace" fill="#374151">2. wide-near</text>
<text x="460.0" y="111.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">1, 4-5</text>
<text x="460.0" y="125.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">not tested: 3</text>
<line x1="305.1" y1="114.0" x2="403.6" y2="114.0" stroke="#2563eb" stroke-width="2"/>
<line x1="305.1" y1="109.0" x2="305.1" y2="119.0" stroke="#2563eb" stroke-width="2"/>
<line x1="403.6" y1="109.0" x2="403.6" y2="119.0" stroke="#2563eb" stroke-width="2"/>
<circle cx="354.4" cy="114.0" r="4.5" fill="#1d4ed8"/>
<text x="354.4" y="105.0" text-anchor="middle" font-size="10" font-family="monospace" fill="#374151">0.750</text>
</g>
<g class="model-row">
<title>unmatched</title>
<text x="12.0" y="162.0" text-anchor="start" font-size="11" font-family="monospace" fill="#374151">3. unmatched</text>
<text x="460.0" y="155.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">-</text>
<text x="460.0" y="169.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">not tested: 1-2, 4-5</text>
<line x1="291.1" y1="158.0" x2="313.7" y2="158.0" stroke="#2563eb" stroke-width="2"/>
<line x1="291.1" y1="153.0" x2="291.1" y2="163.0" stroke="#2563eb" stroke-width="2"/>
<line x1="313.7" y1="153.0" x2="313.7" y2="163.0" stroke="#2563eb" stroke-width="2"/>
<circle cx="302.4" cy="158.0" r="4.5" fill="#1d4ed8"/>
<text x="302.4" y="149.0" text-anchor="middle" font-size="10" font-family="monospace" fill="#374151">0.660</text>
</g>
<g class="model-row">
<title>narrow-gap</title>
<text x="12.0" y="206.0" text-anchor="start" font-size="11" font-family="monospace" fill="#374151">4. narrow-gap</text>
<text x="460.0" y="199.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">2, 5</text>
<text x="460.0" y="213.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">not tested: 3</text>
<line x1="242.4" y1="202.0" x2="350.9" y2="202.0" stroke="#2563eb" stroke-width="2"/>
<line x1="242.4" y1="197.0" x2="242.4" y2="207.0" stroke="#2563eb" stroke-width="2"/>
<line x1="350.9" y1="197.0" x2="350.9" y2="207.0" stroke="#2563eb" stroke-width="2"/>
<circle cx="296.6" cy="202.0" r="4.5" fill="#1d4ed8"/>
<text x="296.6" y="193.0" text-anchor="middle" font-size="10" font-family="monospace" fill="#374151">0.650</text>
</g>
<g class="model-row">
<title>wide-far</title>
<text x="12.0" y="250.0" text-anchor="start" font-size="11" font-family="monospace" fill="#374151">5. wide-far</text>
<text x="460.0" y="243.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">1-2, 4</text>
<text x="460.0" y="257.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">not tested: 3</text>
<line x1="236.2" y1="246.0" x2="345.5" y2="246.0" stroke="#2563eb" stroke-width="2"/>
<line x1="236.2" y1="241.0" x2="236.2" y2="251.0" stroke="#2563eb" stroke-width="2"/>
<line x1="345.5" y1="241.0" x2="345.5" y2="251.0" stroke="#2563eb" stroke-width="2"/>
<circle cx="290.9" cy="246.0" r="4.5" fill="#1d4ed8"/>
<text x="290.9" y="237.0" text-anchor="middle" font-size="10" font-family="monospace" fill="#374151">0.640</text>
</g>
<line x1="217" y1="268" x2="448" y2="268" stroke="#9ca3af" stroke-width="1"/>
<text x="12.0" y="310.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">95% marginal CIs: CLT</text>
<text x="12.0" y="324.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">Not separated: other ranks with Holm-adjusted p &gt;= 0.05. Gaps are preserved; '-' means none. Non-</text>
<text x="12.0" y="338.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">significance does not establish equivalence.</text>
<text x="12.0" y="352.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">The models were not scored on the same questions. Each mean is over that model's own questions;</text>
<text x="12.0" y="366.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">each paired test uses the questions its two models share.</text>
<text x="12.0" y="380.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">4 model pairs have fewer than two shared questions and cannot be tested. Untested pairs establish</text>
<text x="12.0" y="394.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">neither a difference nor equivalence.</text>
</svg>