<text x="460.0" y="132.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">not tested: 1</text>
<line x1="236.3" y1="121.0" x2="428.8" y2="121.0" stroke="#2563eb" stroke-width="2"/>
<line x1="236.3" y1="116.0" x2="236.3" y2="126.0" stroke="#2563eb" stroke-width="2"/>
<line x1="428.8" y1="116.0" x2="428.8" y2="126.0" stroke="#2563eb" stroke-width="2"/>
<circle cx="332.5" cy="121.0" r="4.5" fill="#1d4ed8" stroke="#1d4ed8"/>
<text x="332.5" y="112.0" text-anchor="middle" font-size="10" font-family="monospace" fill="#374151">0.792</text>
