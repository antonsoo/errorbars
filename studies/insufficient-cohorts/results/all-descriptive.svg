<svg xmlns="http://www.w3.org/2000/svg" width="640" height="254" viewBox="0 0 640 254" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img">
<title>Leaderboard with paired comparisons</title>
<desc>Models ranked by mean with marginal confidence intervals. The right column lists exact other ranks without a significant paired difference; this does not establish equivalence. Untested comparisons are identified separately. Open points have no estimable interval because independent units are insufficient.</desc>
<rect width="640" height="254" fill="#ffffff"/>
<text x="12.0" y="34.0" text-anchor="start" font-size="11" font-family="monospace" fill="#374151">Rank / model</text>
<text x="332.5" y="34.0" text-anchor="middle" font-size="11" font-family="monospace" fill="#374151">Mean / CI</text>
<text x="460.0" y="34.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">Not separated: ranks</text>
<line x1="217.0" y1="48" x2="217.0" y2="136" stroke="#e5e7eb" stroke-width="1"/>
<text x="217.0" y="154.0" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">0.18</text>
<line x1="263.2" y1="48" x2="263.2" y2="136" stroke="#e5e7eb" stroke-width="1"/>
<text x="263.2" y="154.0" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">0.23</text>
<line x1="309.4" y1="48" x2="309.4" y2="136" stroke="#e5e7eb" stroke-width="1"/>
<text x="309.4" y="154.0" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">0.28</text>
<line x1="355.6" y1="48" x2="355.6" y2="136" stroke="#e5e7eb" stroke-width="1"/>
<text x="355.6" y="154.0" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">0.32</text>
<line x1="401.8" y1="48" x2="401.8" y2="136" stroke="#e5e7eb" stroke-width="1"/>
<text x="401.8" y="154.0" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">0.37</text>
<line x1="448.0" y1="48" x2="448.0" y2="136" stroke="#e5e7eb" stroke-width="1"/>
<text x="448.0" y="154.0" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">0.42</text>
<g class="model-row">
<title>b</title>
<text x="12.0" y="74.0" text-anchor="start" font-size="11" font-family="monospace" fill="#374151">1. b</text>
<text x="460.0" y="67.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">-</text>
<text x="460.0" y="81.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">not tested: 2</text>
<text x="332.5" y="87.0" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">CI unavailable</text>
<circle cx="428.8" cy="70.0" r="4.5" fill="#ffffff" stroke="#1d4ed8"/>
<text x="428.8" y="61.0" text-anchor="middle" font-size="10" font-family="monospace" fill="#374151">0.400</text>
</g>
<g class="model-row">
<title>a</title>
<text x="12.0" y="118.0" text-anchor="start" font-size="11" font-family="monospace" fill="#374151">2. a</text>
<text x="460.0" y="111.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">-</text>
<text x="460.0" y="125.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">not tested: 1</text>
<text x="332.5" y="131.0" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">CI unavailable</text>
<circle cx="236.2" cy="114.0" r="4.5" fill="#ffffff" stroke="#1d4ed8"/>
<text x="236.2" y="105.0" text-anchor="middle" font-size="10" font-family="monospace" fill="#374151">0.200</text>
</g>
<line x1="217" y1="136" x2="448" y2="136" stroke="#9ca3af" stroke-width="1"/>
<text x="12.0" y="178.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">Descriptive means only; open points: CI unavailable (insufficient independent units)</text>
<text x="12.0" y="192.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">Not separated: other ranks with Holm-adjusted p &gt;= 0.05. Gaps are preserved; '-' means none. Non-</text>
<text x="12.0" y="206.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">significance does not establish equivalence.</text>
<text x="12.0" y="220.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">1 model pairs cannot be tested: 1 with fewer than two shared questions. Untested pairs establish</text>
<text x="12.0" y="234.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">neither a difference nor equivalence.</text>
</svg>