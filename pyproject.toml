[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "errorbars"
version = "0.1.0"
description = "Error bars for LLM evals: standard errors, clustering, paired comparisons, leaderboards, and power analysis."
readme = "README.md"
license = "MIT"
authors = [{ name = "Anton Soloviev" }]
requires-python = ">=3.10"
keywords = [
  "llm-evals",
  "statistics",
  "confidence-intervals",
  "benchmarking",
  "evaluation",
  "language-models",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
plot = ["matplotlib>=3.7"]
cli = ["rich>=13.0"]
inspect = [
  "inspect-ai>=0.3.268",
  # inspect-ai's own dependency ranges resolve to broken prereleases of
  # these two as of 2026-09-24 (httpx 1.0.dev6 dropped the httpcore backend
  # inspect-ai still imports; agent-client-protocol 1.0.0rc2 dropped the
  # `acp.helpers` module inspect-ai still imports). Pin to the last stable
  # versions that actually import.
  "httpx>=0.27,<1.0",
  "agent-client-protocol>=0.12,<1.0",
]
all = ["errorbars[pandas,plot,cli]"]

[project.scripts]
errorbars = "errorbars.cli:main"

[project.urls]
Homepage = "https://github.com/antonsoo/errorbars"
Repository = "https://github.com/antonsoo/errorbars"
Issues = "https://github.com/antonsoo/errorbars/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/errorbars"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "pandas>=1.5",
  "matplotlib>=3.7",
  "rich>=13.0",
  "inspect-ai>=0.3.268",
  # Pinned below their latest (as of 2026-09-24): inspect-ai's declared
  # ranges resolve to prerelease versions of these two (httpx 1.0.dev6,
  # agent-client-protocol 1.0.0rc2) that are broken against this inspect-ai
  # release. Pin to the last stable versions that work.
  "httpx<1.0",
  "agent-client-protocol==0.12.1",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N806"]

[tool.mypy]
# Not pinned to 3.10 (our floor): numpy's shipped stubs use 3.12-only
# syntax that mypy chokes on under an older target. We still declare
# requires-python = ">=3.10" and run the test suite on 3.10-3.12 in CI.
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
