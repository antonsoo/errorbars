<text x="12.0" y="169.0" text-anchor="start" font-size="11" font-family="monospace" fill="#374151">3. 20251215_livesweagent_cla</text>
<text x="12.0" y="183.0" text-anchor="start" font-size="11" font-family="monospace" fill="#374151">ude-opus-4-5</text>
<text x="460.0" y="169.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">2</text>
<text x="460.0" y="183.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">not tested: 1</text>
<line x1="245.5" y1="172.0" x2="419.5" y2="172.0" stroke="#2563eb" stroke-width="2"/>
<line x1="245.5" y1="167.0" x2="245.5" y2="177.0" stroke="#2563eb" stroke-width="2"/>
<line x1="419.5" y1="167.0" x2="419.5" y2="177.0" stroke="#2563eb" stroke-width="2"/>
<circle cx="332.5" cy="172.0" r="4.5" fill="#1d4ed8" stroke="#1d4ed8"/>
<text x="332.5" y="163.0" text-anchor="middle" font-size="10" font-family="monospace" fill="#374151">0.792</text>
</g>
<line x1="217" y1="194" x2="448" y2="194" stroke="#9ca3af" stroke-width="1"/>
<text x="12.0" y="236.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">95% marginal CIs: CR2 with clusters; open points: CI unavailable (insufficient independent units)</text>
<text x="12.0" y="250.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">Not separated: other ranks with Holm-adjusted p &gt;= 0.05. Gaps are preserved; '-' means none. Non-</text>
<text x="12.0" y="264.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">significance does not establish equivalence.</text>
<text x="12.0" y="278.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">The models were not scored on the same questions. Each mean is over that model's own questions;</text>
<text x="12.0" y="292.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">each paired test uses the questions its two models share.</text>
<text x="12.0" y="306.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">2 model pairs cannot be tested: 2 with only one shared independent cluster. Untested pairs</text>
<text x="12.0" y="320.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">establish neither a difference nor equivalence.</text>
</svg>