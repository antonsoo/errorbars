<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img">
<title>Leaderboard with paired comparisons</title>
<desc>Models ranked by mean with marginal confidence intervals. The right column lists exact other ranks without a significant paired difference; this does not establish equivalence. Untested comparisons are identified separately. Open points have no estimable interval because independent units are insufficient.</desc>
<rect width="640" height="340" fill="#ffffff"/>
<text x="12.0" y="34.0" text-anchor="start" font-size="11" font-family="monospace" fill="#374151">Rank / model</text>
<text x="332.5" y="34.0" text-anchor="middle" font-size="11" font-family="monospace" fill="#374151">Mean / CI</text>
<text x="460.0" y="34.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">Not separated: ranks</text>
<line x1="217.0" y1="48" x2="217.0" y2="194" stroke="#e5e7eb" stroke-width="1"/>
<text x="217.0" y="212.0" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">0.68</text>
<line x1="263.2" y1="48" x2="263.2" y2="194" stroke="#e5e7eb" stroke-width="1"/>
<text x="263.2" y="212.0" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">0.73</text>
<line x1="309.4" y1="48" x2="309.4" y2="194" stroke="#e5e7eb" stroke-width="1"/>
<text x="309.4" y="212.0" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">0.77</text>
<line x1="355.6" y1="48" x2="355.6" y2="194" stroke="#e5e7eb" stroke-width="1"/>
<text x="355.6" y="212.0" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">0.81</text>
<line x1="401.8" y1="48" x2="401.8" y2="194" stroke="#e5e7eb" stroke-width="1"/>
<text x="401.8" y="212.0" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">0.86</text>
<line x1="448.0" y1="48" x2="448.0" y2="194" stroke="#e5e7eb" stroke-width="1"/>
<text x="448.0" y="212.0" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">0.90</text>
<g class="model-row">
<title>django-only</title>
<text x="12.0" y="74.0" text-anchor="start" font-size="11" font-family="monospace" fill="#374151">1. django-only</text>
<text x="460.0" y="67.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">-</text>
<text x="460.0" y="81.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">not tested: 2-3</text>
<text x="332.5" y="87.0" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">CI unavailable</text>
<circle cx="369.1" cy="70.0" r="4.5" fill="#ffffff" stroke="#1d4ed8"/>
<text x="369.1" y="61.0" text-anchor="middle" font-size="10" font-family="monospace" fill="#374151">0.827</text>
</g>
<g class="model-row">
<title>20251205_sonar-foundation-agent_claude-opus-4-5</title>
<text x="12.0" y="111.0" text-anchor="start" font-size="11" font-family="monospace" fill="#374151">2. 20251205_sonar-</text>
<text x="12.0" y="125.0" text-anchor="start" font-size="11" font-family="monospace" fill="#374151">foundation-agent_claude-</text>
<text x="12.0" y="139.0" text-anchor="start" font-size="11" font-family="monospace" fill="#374151">opus-4-5</text>
