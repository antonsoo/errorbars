<svg xmlns="http://www.w3.org/2000/svg" width="640" height="370" viewBox="0 0 640 370" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img">
<title>Leaderboard with paired comparisons</title>
<desc>Models ranked by mean with marginal confidence intervals. The right column lists exact other ranks without a significant paired difference; this does not establish equivalence. Untested comparisons are identified separately.</desc>
<rect width="640" height="370" fill="#ffffff"/>
<text x="12.0" y="34.0" text-anchor="start" font-size="11" font-family="monospace" fill="#374151">Rank / model</text>
<text x="332.5" y="34.0" text-anchor="middle" font-size="11" font-family="monospace" fill="#374151">Mean / CI</text>
<text x="460.0" y="34.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">Not separated: ranks</text>
<line x1="217.0" y1="48" x2="217.0" y2="224" stroke="#e5e7eb" stroke-width="1"/>
<text x="217.0" y="242.0" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">-4.07</text>
<line x1="263.2" y1="48" x2="263.2" y2="224" stroke="#e5e7eb" stroke-width="1"/>
<text x="263.2" y="242.0" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">-2.24</text>
<line x1="309.4" y1="48" x2="309.4" y2="224" stroke="#e5e7eb" stroke-width="1"/>
<text x="309.4" y="242.0" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">-0.41</text>
<line x1="355.6" y1="48" x2="355.6" y2="224" stroke="#e5e7eb" stroke-width="1"/>
<text x="355.6" y="242.0" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">1.41</text>
<line x1="401.8" y1="48" x2="401.8" y2="224" stroke="#e5e7eb" stroke-width="1"/>
<text x="401.8" y="242.0" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">3.24</text>
<line x1="448.0" y1="48" x2="448.0" y2="224" stroke="#e5e7eb" stroke-width="1"/>
<text x="448.0" y="242.0" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">5.07</text>
<g class="model-row">
<title>model-d</title>
<text x="12.0" y="74.0" text-anchor="start" font-size="11" font-family="monospace" fill="#374151">1. model-d</text>
<text x="460.0" y="74.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">2-4</text>
<line x1="328.8" y1="70.0" x2="341.3" y2="70.0" stroke="#2563eb" stroke-width="2"/>
<line x1="328.8" y1="65.0" x2="328.8" y2="75.0" stroke="#2563eb" stroke-width="2"/>
<line x1="341.3" y1="65.0" x2="341.3" y2="75.0" stroke="#2563eb" stroke-width="2"/>
<circle cx="335.0" cy="70.0" r="4.5" fill="#1d4ed8"/>
<text x="335.0" y="61.0" text-anchor="middle" font-size="10" font-family="monospace" fill="#374151">0.600</text>
</g>
<g class="model-row">
<title>model-a</title>
<text x="12.0" y="118.0" text-anchor="start" font-size="11" font-family="monospace" fill="#374151">2. model-a</text>
<text x="460.0" y="111.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">1</text>
<text x="460.0" y="125.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">not tested: 3-4</text>
<line x1="285.6" y1="114.0" x2="381.9" y2="114.0" stroke="#2563eb" stroke-width="2"/>
<line x1="285.6" y1="109.0" x2="285.6" y2="119.0" stroke="#2563eb" stroke-width="2"/>
<line x1="381.9" y1="109.0" x2="381.9" y2="119.0" stroke="#2563eb" stroke-width="2"/>
<circle cx="333.8" cy="114.0" r="4.5" fill="#1d4ed8"/>
<text x="333.8" y="105.0" text-anchor="middle" font-size="10" font-family="monospace" fill="#374151">0.550</text>
</g>
<g class="model-row">
<title>model-b</title>
<text x="12.0" y="162.0" text-anchor="start" font-size="11" font-family="monospace" fill="#374151">3. model-b</text>
<text x="460.0" y="155.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">1</text>
<text x="460.0" y="169.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">not tested: 2, 4</text>
<line x1="236.2" y1="158.0" x2="428.8" y2="158.0" stroke="#2563eb" stroke-width="2"/>
<line x1="236.2" y1="153.0" x2="236.2" y2="163.0" stroke="#2563eb" stroke-width="2"/>
<line x1="428.8" y1="153.0" x2="428.8" y2="163.0" stroke="#2563eb" stroke-width="2"/>
<circle cx="332.5" cy="158.0" r="4.5" fill="#1d4ed8"/>
<text x="332.5" y="149.0" text-anchor="middle" font-size="10" font-family="monospace" fill="#374151">0.500</text>
</g>
<g class="model-row">
<title>model-c</title>
<text x="12.0" y="206.0" text-anchor="start" font-size="11" font-family="monospace" fill="#374151">4. model-c</text>
<text x="460.0" y="199.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">1</text>
<text x="460.0" y="213.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">not tested: 2-3</text>
<line x1="283.1" y1="202.0" x2="379.4" y2="202.0" stroke="#2563eb" stroke-width="2"/>
<line x1="283.1" y1="197.0" x2="283.1" y2="207.0" stroke="#2563eb" stroke-width="2"/>
<line x1="379.4" y1="197.0" x2="379.4" y2="207.0" stroke="#2563eb" stroke-width="2"/>
<circle cx="331.2" cy="202.0" r="4.5" fill="#1d4ed8"/>
<text x="331.2" y="193.0" text-anchor="middle" font-size="10" font-family="monospace" fill="#374151">0.450</text>
</g>
<line x1="217" y1="224" x2="448" y2="224" stroke="#9ca3af" stroke-width="1"/>
<text x="12.0" y="266.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">95% marginal CIs: CR2 with clusters</text>
<text x="12.0" y="280.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">Not separated: other ranks with Holm-adjusted p &gt;= 0.05. Gaps are preserved; '-' means none. Non-</text>
<text x="12.0" y="294.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">significance does not establish equivalence.</text>
<text x="12.0" y="308.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">The models were not scored on the same questions. Each mean is over that model's own questions;</text>
<text x="12.0" y="322.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">each paired test uses the questions its two models share.</text>
<text x="12.0" y="336.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">3 model pairs cannot be tested: 3 with only one shared independent cluster. Untested pairs</text>
<text x="12.0" y="350.0" text-anchor="start" font-size="10" font-family="monospace" fill="#374151">establish neither a difference nor equivalence.</text>
</svg>